<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="Imagens/Trilhas icon.svg">
    <link rel="stylesheet" href="login.css">
    <title>Login Trilhas</title>
</head>

<body>
    <div class="bloco_centro">
        <form action="">
            <h1>🎲🕹️Trilhas🎨💾</h1>

            <div class="input_box">
                <input type="text" placeholder="Nome do Usuário" required>
            </div>

            <div class="input_box">
                <input type="password" placeholder="Senha" required>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">   Lembre de Mim</label>
                <a href="#">Esqueceu a senha ?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Ainda não possui uma conta ? <a href="registro.html">Registrar</a> </p>
            </div>

        </form>
    </div>
</body>

</html>
