<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="confirmacao.css">
    <link rel="icon" type="image/svg" href="Imagens/Trilhas icon.svg">
    <title>Confirmação</title>
</head>

<body>
<header>
    <div class="interface">
        <section class="logo">
            <img src="Imagens/Logo.svg" alt="Logo do Trilhas azul e laranja">
        </section>
    </div>
</header>

<section class="conteudo">
    <div id="tittle">
        <h1>Você confirma que os seus dados estão corretos?</h1>
    </div>

    <div class="botoesALL">

        <div class="botoes">
            <button class="botao-esquerda" id="botaoSim" disabled>
                <img src="Imagens/Flecha Esquerda.png" alt="seta para esquerda laranja">
                Sim
            </button>
            <button class="botao-direita" id="botaoNao">
                Não
                <img src="Imagens/s-azul-direita.svg" alt="seta para direita azul">
            </button>
        </div>

        <div class="aceito">
            <label class="checkbox-label">
                <input type="checkbox" id="termosCheckbox">
                <span class="checkbox-custom"></span>
                Confirmo que meu dados estão corretos e aceito os termos e condições do Projeto Trilhas
            </label>
        </div>

</section>

<script src="confirmacao.js"></script>
</body>
</html>
