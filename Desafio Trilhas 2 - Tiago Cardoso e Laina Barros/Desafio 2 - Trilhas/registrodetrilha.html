<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha da Trilha</title>
    <link rel="stylesheet" href="registrodetrilha.css">
    <link rel="icon" type="image/svg" href="Imagens/Trilhas icon.svg">
</head>

<main>
    <body>

        <header>
            <div class="interface">
                <section class="logo">
                    <img src="Imagens/Logo.svg" alt="Logo do Trilhas azul e laranja">
                </section>
            </div>
        </header>

        <section class="allus">
            <div class="form-tittle">
                <img class="s-azul-es">
                <h2>Escolha a sua Trilha</h2>
                <img class="s-azul-di">
            </div>

            <div class="container">
                <input type="radio" id="checkboxFrontEnd" name="trilha" class="hidden-radio">
                <label for="checkboxFrontEnd" class="bloco-front"> 
                    <span id="PFrontE">Programação Front-End</span>
                    <img src="Imagens/Icons/Front-end icon.svg" alt="não selecionado" class="icon-default">
                    <img src="Imagens/Icons/Front-end icon selecionado.svg" alt="selecionado" class="icon-selected">
                    <img src="Imagens/Icons/Logo - Pequeno.svg" alt="Logo pequeno trilhas">
                </label>
            
                <input type="radio" id="checkboxBakcEnd" name="trilha" class="hidden-radio">
                <label for="checkboxBakcEnd" class="bloco-end"> 
                    <span id="PBackE">Programação Back-End</span>
                    <img src="Imagens/Icons/Back-End Icon.svg" alt="não selecionado" class="icon-default">
                    <img src="Imagens/Icons/Back End Icon selecionado.svg" alt="selecionado" class="icon-selected">
                    <img src="Imagens/Icons/Logo - Pequeno.svg" alt="Logo pequeno trilhas">
                </label>

                <input type="radio" id="checkboxCDD" name="trilha" class="hidden-radio">
                <label for="checkboxCDD" class="bloco-cdd"> 
                    <span id="CDD">Ciência de Dados</span>
                    <img src="Imagens/Icons/CDD Icon.svg" alt="não selecionado" class="icon-default">
                    <img src="Imagens/Icons/CDD Icon selecionado.svg" alt="selecionado" class="icon-selected-cdd">
                    <img src="Imagens/Icons/Logo - Pequeno.svg" alt="Logo pequeno trilhas">
                </label>

                <input type="radio" id="checkboxUX" name="trilha" class="hidden-radio">
                <label for="checkboxUX" class="bloco-ux"> 
                    <span id="UX">UX/UI Design</span>
                    <img src="Imagens/Icons/Ux Icon.svg" alt="não selecionado" class="icon-default">
                    <img src="Imagens/Icons/Ux Icon selecionado.svg" alt="selecionado" class="icon-selected">
                    <img src="Imagens/Icons/Logo - Pequeno.svg" alt="Logo pequeno trilhas">
                </label>

                <input type="radio" id="checkboxJogos" name="trilha" class="hidden-radio">
                <label for="checkboxJogos" class="bloco-jogos"> 
                    <span id="Jogos">Programação de Jogos</span>
                    <img src="Imagens/Icons/Jogos Icon.svg" alt="não selecionado" class="icon-default">
                    <img src="Imagens/Icons/Jogos Icon selecionado.svg" alt="selecionado" class="icon-selected-jogos">
                    <img src="Imagens/Icons/Logo - Pequeno.svg" alt="Logo pequeno trilhas">
                </label>
            </div>

            <div class="setas">
                <img class="seta-e">
                <a href="dadosespecificos.html" aria-required="true">CONFIRMAR</a>
                <img class="seta-d">
            </div>
        </section>    
    </body>
</main>
</html>
